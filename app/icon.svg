<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Emerald tile + a browser window: the motif used across the site's theme
       previews. Drawn as paths, not <text> — SVG favicons render without any
       guarantee the font is available, so letterforms would be a lottery. -->
  <rect width="32" height="32" rx="7" fill="#047857"/>
  <rect x="6.5" y="8" width="19" height="16" rx="2.5" fill="#ffffff"/>
  <path d="M6.5 13.25h19" stroke="#047857" stroke-width="1.4"/>
  <circle cx="9.6" cy="10.6" r="0.95" fill="#047857"/>
  <circle cx="12.6" cy="10.6" r="0.95" fill="#047857"/>
  <circle cx="15.6" cy="10.6" r="0.95" fill="#047857"/>
</svg>
